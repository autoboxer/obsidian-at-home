[package]
name = "obsidian-at-home"
version = "1.6.0"
description = "A local-only desktop app for writing, organizing, and linking Markdown notes."
authors = ["Jared Collier"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "obsidian_at_home_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
fontdb = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# keep core minors and plugin versions aligned with package.json
tauri = { version = "~2.12.7", features = [] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "=2.7.3"
walkdir = "2"
