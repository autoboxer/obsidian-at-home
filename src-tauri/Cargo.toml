[package]
name = "obsidian-at-home"
version = "0.1.0"
description = "A local-only desktop app for writing, organizing, and linking Markdown notes."
authors = ["Jared Collier"]
edition = "2021"

[lib]
name = "obsidian_at_home_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
walkdir = "2"
